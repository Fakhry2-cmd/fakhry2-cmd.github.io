<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام عيادة الأنامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* واجهة العيادة: قائمة جانبية بلون العيادة الداكن، شريط علوي للبحث والإجراءات، وشريط سفلي على الجوال */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#EDF2F0; --ink:#13211F; --muted:#5A6A67; --line:#DFE6E4;
  --brand:#C4541A; --brand-fill:#D95F20; --brand-soft:#FCEADD; --gold:#8F6A12; --gold-soft:#F7EED6;
  --over:#B42318; --over-bg:#FCEAE8; --soon:#A04A05; --soon-bg:#FDF1DF; --ok:#17784A; --ok-bg:#E2F3EA; --info:#1C5AC2; --info-bg:#E7EFFC;
  --wa:#1C8C4C; --r:16px; --s1:#2a78d6; --s2:#eb6834; --shadow:0 1px 2px rgba(19,33,31,.04);
  --nav:#0F2B27; --nav-2:#163832; --nav-ink:#E3EEEB; --nav-mut:#8FB0A9; --hero:#123630; --hero-2:#1A4840;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1412; --surface:#121E1B; --sunk:#0E1917; --ink:#E5EEEB; --muted:#8EA49F; --line:#1F302C;
  --brand:#F08A55; --brand-fill:#E8763E; --brand-soft:#3A2216; --gold:#DDB04F; --gold-soft:#2A2312;
  --over:#FF8A7E; --over-bg:#3A1C18; --soon:#F7B547; --soon-bg:#33240F; --ok:#6FD39E; --ok-bg:#142C1E; --info:#8DB4FF; --info-bg:#162238;
  --wa:#2FA862; --s1:#3987e5; --s2:#d95926; --shadow:none;
  --nav:#08100E; --nav-2:#12201D; --nav-ink:#DCE8E4; --nav-mut:#7F9A94; --hero:#143A33; --hero-2:#1C4A41; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1412; --surface:#121E1B; --sunk:#0E1917; --ink:#E5EEEB; --muted:#8EA49F; --line:#1F302C;
  --brand:#F08A55; --brand-fill:#E8763E; --brand-soft:#3A2216; --gold:#DDB04F; --gold-soft:#2A2312;
  --over:#FF8A7E; --over-bg:#3A1C18; --soon:#F7B547; --soon-bg:#33240F; --ok:#6FD39E; --ok-bg:#142C1E; --info:#8DB4FF; --info-bg:#162238;
  --wa:#2FA862; --s1:#3987e5; --s2:#d95926; --shadow:none;
  --nav:#08100E; --nav-2:#12201D; --nav-ink:#DCE8E4; --nav-mut:#7F9A94; --hero:#143A33; --hero-2:#1C4A41; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
aside{background:var(--nav);color:var(--nav-ink);padding:18px 14px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:thin;z-index:30}
aside .brand{font-weight:700;font-size:.98rem;padding:2px 8px 16px;line-height:1.35;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
aside .brand .mk{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
aside .brand .mk img{width:100%;height:100%;object-fit:contain;padding:3px}
aside .brand .mk svg{width:22px;height:22px;fill:var(--brand-fill)}
aside .brand small{display:block;color:var(--nav-mut);font-weight:500;font-size:.74rem;margin-top:2px}
aside .grp{font-size:.72rem;font-weight:600;color:var(--nav-mut);padding:12px 12px 4px}
aside button{all:unset;cursor:pointer;position:relative;display:flex;gap:11px;align-items:center;padding:8px 12px;border-radius:10px;font-weight:500;font-size:.9rem;color:var(--nav-ink);opacity:.82}
aside button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside button:hover{background:var(--nav-2);opacity:1}
aside button.on{background:var(--nav-2);opacity:1;font-weight:700}
aside button.on::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-fill)}
aside button.on svg{color:#F49A68}
aside button .b{margin-inline-start:auto;font-size:.72rem;font-weight:700;background:var(--brand-fill);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center;line-height:1.5}
aside .foot{margin-top:auto;font-size:.74rem;color:var(--nav-mut);padding:14px 10px 2px;display:flex;align-items:center;gap:8px}
aside .foot i{width:8px;height:8px;border-radius:50%;background:#3FBF7F;flex:none}
aside .foot i.off{background:#FF8A7E}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1440px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:10px}
.top .menu,.top .tb-brand{display:none}
.search{position:relative;flex:1 1 auto;max-width:460px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{padding:9px 38px 9px 12px;border-radius:11px;background:var(--surface);height:40px}
.top .acts{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--brand)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:24px 28px 80px;min-width:0;max-width:1440px;width:100%;margin:0 auto}
.tabs{display:none}
.fab{display:none}
.vpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.vchk{position:relative;cursor:pointer}
.vchk input{position:absolute;opacity:0;pointer-events:none}
.vchk span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.86rem;font-weight:500;background:var(--surface);user-select:none}
.vchk span small{color:var(--muted);font-size:.74rem}
.vchk input:checked+span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.vchk input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.vtab{border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:2px}
.vr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.vr:first-child{border-top:0}
.vr label{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);font-weight:600}
.vr input{width:auto}
details.more{flex-basis:100%;border-top:1px dashed var(--line);padding-top:6px}
details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:.85rem;padding:2px 0;list-style-position:inside}
details.more[open] summary{margin-bottom:8px}
.qfound{flex-basis:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-bg);border-radius:10px;padding:8px 12px}
.qfound.new{background:var(--info-bg)}
.qdyn{display:flex;flex-direction:column;gap:10px}
.tel{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted)}
.icon-btn.bk{position:relative}
.icon-btn.bk i{display:none;position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--over)}
.icon-btn.bk.due i{display:block}
.icon-btn.bk.due{color:var(--over);border-color:color-mix(in srgb,var(--over) 40%,var(--line))}
@media (min-width:861px){.msearch{display:none}}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset-block:0;inset-inline-start:0;width:280px;max-width:84vw;height:100%;transform:translateX(105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,13,.45);z-index:25}
  .top .in{padding:10px 14px}
  .top .menu{display:grid}
  .top .tb-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;min-width:0}
  .top .tb-brand img{width:32px;height:32px;border-radius:9px;background:#fff;object-fit:contain;padding:2px;flex:none}
  .top .tb-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search{display:none}
  .top .acts .btn{display:none}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:22;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
  .tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabs button.on{color:var(--brand)}
  .fab{all:unset;cursor:pointer;display:grid;place-items:center;position:fixed;inset-inline-end:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--brand-fill);color:#fff;box-shadow:0 8px 20px rgba(217,95,32,.35);z-index:23}
  .fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  .tabs .b{position:absolute;top:0;inset-inline-start:calc(50% + 6px);font-size:.64rem;background:var(--brand-fill);color:#fff;border-radius:99px;padding:0 5px;min-width:16px;text-align:center;line-height:1.5}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
h1{font-size:1.45rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.02rem;margin:0;display:flex;align-items:center;gap:8px;font-weight:700}
h3{font-size:.92rem;margin:0}
.n{background:var(--sunk);color:var(--muted);border-radius:99px;padding:0 9px;font-size:.75rem;font-weight:600}
.page{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.head .sub{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
@media (max-width:860px){.card{padding:14px 15px}}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.dash{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:13px}.kpi .v{font-size:1.5rem}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.kpi:hover{border-color:var(--brand)}
.kpi .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--k-bg,var(--sunk));color:var(--k,var(--muted));flex:none}
.kpi .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi .v{font-size:1.85rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .l{font-size:.84rem;font-weight:600;color:var(--muted)}
.kpi .s{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:22px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-70px;width:260px;height:260px;border-radius:50%;border:44px solid rgba(255,255,255,.04);pointer-events:none}
.hero h1{font-size:1.7rem;color:#fff}
.hero .sub{color:rgba(255,255,255,.72);margin:4px 0 0}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:.86rem;color:rgba(255,255,255,.8)}
.hero .meta b{color:#fff;font-size:1rem;margin-inline-end:4px;font-variant-numeric:tabular-nums}
.hero .q{background:var(--hero-2);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.hero .q .big{display:flex;align-items:baseline;gap:8px}
.hero .q .big b{font-size:2.6rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.hero .q .big span{font-size:.92rem;color:rgba(255,255,255,.82)}
.hero .q .bar{background:rgba(255,255,255,.12);height:6px;margin:0}
.hero .q .bar i{background:#F49A68}
.hero .q .lim{font-size:.76rem;color:rgba(255,255,255,.7);display:flex;justify-content:space-between}
.hero .btn.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff;height:42px;font-size:.92rem}
.hero .btn.ghost{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding:18px;border-radius:18px}.hero h1{font-size:1.35rem}.hero::after{display:none}}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money .m{border-radius:12px;padding:12px 14px;background:var(--sunk)}
.money .m b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.money .m.good{background:var(--ok-bg)} .money .m.good b{color:var(--ok)}
.money .m.bad{background:var(--over-bg)} .money .m.bad b{color:var(--over)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;font-weight:600;text-align:center}
.quick button:hover{border-color:var(--brand);color:var(--brand)}
.quick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .tm{font-variant-numeric:tabular-nums;font-weight:700;min-width:66px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1 1 auto}
.t{font-weight:700}
.sub{color:var(--muted);font-size:.85rem}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--c,var(--line))}
.tile .v{font-size:1.6rem;font-weight:700;line-height:1.2;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.tile .l{font-size:.82rem;font-weight:600}
.tile .s{font-size:.72rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}
.chip{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.c-over{background:var(--over-bg);color:var(--over)}.c-soon{background:var(--soon-bg);color:var(--soon)}.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-info{background:var(--info-bg);color:var(--info)}.c-mut{background:var(--sunk);color:var(--muted)}.c-gold{background:var(--gold-soft);color:var(--gold)}
.btn{font:inherit;font-weight:600;font-size:.87rem;border-radius:10px;padding:7px 15px;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.gh{background:none;border-color:transparent;color:var(--muted)}
.btn.dan{color:var(--over)}
.btn.armed{background:var(--over);border-color:var(--over);color:#fff}
.btn.sm{padding:4px 11px;font-size:.8rem;min-height:30px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;line-height:1.7}
input[type=color]{padding:2px;height:38px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);flex:1 1 160px;min-width:0}
label.ck{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
label.ck input{width:auto}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.full{flex-basis:100%}
.msg{background:var(--sunk);border-radius:9px;padding:10px 12px;white-space:pre-wrap;font-family:var(--font);font-size:.88rem;margin:0;line-height:1.8}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;font-weight:600;color:var(--muted);background:var(--sunk);white-space:nowrap}
th,td{padding:10px 12px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.nw{white-space:nowrap}
tr.bad td{background:var(--over-bg)} tr.warn td{background:var(--soon-bg)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:12px;padding:10px 14px;font-size:.88rem;border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-inline-start:3px solid var(--gold);background:var(--gold-soft)}
.banner.red{border-color:color-mix(in srgb,var(--over) 28%,transparent);border-inline-start-color:var(--over);background:var(--over-bg)}
.pet{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.svc:first-child{border-top:0}
.ph{display:flex;flex-wrap:wrap;gap:6px}
.ph button{font:inherit;font-size:.76rem;border:1px dashed var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:1px 8px;cursor:pointer}
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.studio{grid-template-columns:minmax(0,1fr)}}
.preview{display:flex;justify-content:center;background:var(--sunk);border-radius:var(--r);padding:14px;position:sticky;top:16px}
.preview canvas{max-width:100%;max-height:78vh;height:auto;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tpls button,.arts .art{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.76rem;font-weight:600;text-align:center;background:var(--surface);color:var(--ink)}
.tpls button:hover,.arts .art:hover{border-color:var(--brand)}
.tpls svg,.arts svg{width:56px;height:56px}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.arts .art.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);color:var(--brand)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer}
.swatches button.on{outline:2px solid var(--ink)}
.tplstrip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.tplstrip canvas{height:300px;width:auto;flex:none;border-radius:6px;border:1px solid var(--line);background:#fff}
.book{display:flex;flex-direction:column;align-items:center;gap:18px}
.book canvas{width:100%;max-width:560px;height:auto;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:40;overflow-y:auto}
.modal .sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;font-size:.88rem;z-index:60}
.toast.err{background:var(--over);color:#fff}
.wastat{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wastat .dot{width:14px;height:14px;border-radius:50%;background:var(--over);box-shadow:0 0 0 5px var(--over-bg);flex:none}
.wastat .dot.on{background:var(--ok);box-shadow:0 0 0 5px var(--ok-bg)}
.wastat b{font-size:1.15rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--surface)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.steps{display:flex;flex-direction:column}
.steps label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.steps label:first-child{border-top:0}
.steps input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.steps .t{font-size:.92rem}
.steps .done .t{color:var(--muted);text-decoration:line-through}
.steps .sub{grid-column:2}
code.k{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;background:var(--sunk);border-radius:6px;padding:1px 6px}
.tips{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <aside id="nav" aria-label="القائمة"></aside>
  <div class="col"><header class="top" id="top"></header><main id="main"></main></div>
</div>
<div class="scrim" data-act="drawer"></div>
<nav class="tabs" id="tabs" aria-label="التنقل السريع"></nav>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filePick" hidden>

//   CLINIC_KEY      رمز الربط، نفس اللي في صفحة «ربط واتساب»
//   VERIFY_TOKEN    كلمة التحقق لتنبيهات ميتا
//   ALLOWED_ORIGIN  رابط النظام مثل https://anamel-clinic.github.io
//   APP_SECRET      (اختياري) سر التطبيق للتحقق من توقيع التنبيهات
// ربط KV اختياري باسم WA_KV لحفظ حالات التسليم وطلبات الإيقاف
// رابط التنبيهات في ميتا: <رابط الخادم>/webhook
const GRAPH = 'https://graph.facebook.com/v23.0'; // حدّث رقم الإصدار إذا طلبت ميتا

export default {
  async fetch(req, env) {
    const url = new URL(req.url);
    const cors = {
      'Access-Control-Allow-Origin': env.ALLOWED_ORIGIN || '*',
      'Access-Control-Allow-Headers': 'Content-Type, X-Clinic-Key',
      'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
      'Vary': 'Origin'
    };
    const json = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { 'Content-Type': 'application/json; charset=utf-8', ...cors } });
    if (req.method === 'OPTIONS') return new Response(null, { headers: cors });

    // تنبيهات ميتا
    if (url.pathname === '/webhook') {
      if (req.method === 'GET') {
        const ok = url.searchParams.get('hub.mode') === 'subscribe' && url.searchParams.get('hub.verify_token') === env.VERIFY_TOKEN;
        return new Response(ok ? url.searchParams.get('hub.challenge') : 'forbidden', { status: ok ? 200 : 403 });
      }
      const raw = await req.text();
      if (env.APP_SECRET && !(await validSig(raw, req.headers.get('X-Hub-Signature-256'), env.APP_SECRET))) return new Response('bad signature', { status: 401 });
      if (env.WA_KV) {
        let body = {}; try { body = JSON.parse(raw || '{}'); } catch (e) {}
        for (const e of body.entry || []) for (const ch of e.changes || []) {
          const v = ch.value || {};
          for (const s of v.statuses || []) {
            await env.WA_KV.put('st:' + s.id, JSON.stringify({ status: s.status, at: s.timestamp, err: s.errors && s.errors[0] ? s.errors[0].title : '' }), { expirationTtl: 60 * 60 * 24 * 35 });
          }
          for (const m of v.messages || []) {
            const txt = ((m.text && m.text.body) || (m.button && m.button.text) || '').trim();
            if (/^(إيقاف|ايقاف|stop)$/i.test(txt)) await env.WA_KV.put('optout:' + m.from, String(Date.now()));
          }
        }
      }
      return new Response('ok');
    }

    // طلبات صفحة العيادة
    const origin = req.headers.get('Origin') || '';
    if (env.ALLOWED_ORIGIN && origin !== env.ALLOWED_ORIGIN) return json({ ok: false, error: 'origin' }, 403);
    if (!env.CLINIC_KEY || req.headers.get('X-Clinic-Key') !== env.CLINIC_KEY) return json({ ok: false, error: 'key' }, 401);
    const auth = { Authorization: 'Bearer ' + env.WA_TOKEN };

    if (url.pathname === '/health') {
      const r = await fetch(GRAPH + '/' + env.PHONE_ID + '?fields=display_phone_number,verified_name,quality_rating,messaging_limit_tier', { headers: auth });
      const d = await r.json();
      if (!r.ok) return json({ ok: false, error: metaErr(d) }, 502);
      return json({ ok: true, phone: d.display_phone_number, name: d.verified_name, quality: d.quality_rating, tier: d.messaging_limit_tier, kv: !!env.WA_KV });
    }

    if (url.pathname === '/media' && req.method === 'POST') {
      const type = req.headers.get('Content-Type') || 'image/png';
      if (!/^image\/(png|jpeg)$/.test(type)) return json({ ok: false, error: 'نوع الصورة غير مدعوم' }, 400);
      const fd = new FormData();
      fd.append('messaging_product', 'whatsapp');
      fd.append('type', type);
      fd.append('file', new Blob([await req.arrayBuffer()], { type }), type === 'image/png' ? 'card.png' : 'card.jpg');
      const r = await fetch(GRAPH + '/' + env.PHONE_ID + '/media', { method: 'POST', headers: auth, body: fd });
      const d = await r.json();
      return r.ok ? json({ ok: true, id: d.id }) : json({ ok: false, error: metaErr(d) }, 502);
    }

    if (url.pathname === '/send' && req.method === 'POST') {
      const b = await req.json();
      if (!/^9665\d{8}$/.test(b.to || '')) return json({ ok: false, error: 'رقم غير صالح' }, 400);
      if (!/^[a-z0-9_]{1,512}$/.test(b.template || '')) return json({ ok: false, error: 'اسم قالب غير صالح' }, 400);
      if (b.marketing && env.WA_KV && await env.WA_KV.get('optout:' + b.to)) return json({ ok: false, error: 'optout' }, 409);
      const components = [];
      if (b.image) components.push({ type: 'header', parameters: [{ type: 'image', image: { id: String(b.image) } }] });
      if (Array.isArray(b.params) && b.params.length) components.push({ type: 'body', parameters: b.params.map(t => ({ type: 'text', text: String(t) })) });
      const template = { name: b.template, language: { code: b.lang || 'ar' } };
      if (components.length) template.components = components;
      const r = await fetch(GRAPH + '/' + env.PHONE_ID + '/messages', {
        method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' },
        body: JSON.stringify({ messaging_product: 'whatsapp', to: b.to, type: 'template', template })
      });
      const d = await r.json();
      return r.ok ? json({ ok: true, id: d.messages && d.messages[0] ? d.messages[0].id : '' }) : json({ ok: false, error: metaErr(d) }, 502);
    }

    if (url.pathname === '/updates') {
      if (!env.WA_KV) return json({ ok: true, kv: false, statuses: {}, optouts: [] });
      const ids = (url.searchParams.get('ids') || '').split(',').filter(Boolean).slice(0, 100);
      const statuses = {};
      for (const id of ids) { const v = await env.WA_KV.get('st:' + id); if (v) statuses[id] = JSON.parse(v); }
      const list = await env.WA_KV.list({ prefix: 'optout:' });
      return json({ ok: true, kv: true, statuses, optouts: list.keys.map(k => k.name.slice(7)) });
    }

    return json({ ok: false, error: 'not found' }, 404);
  }
};

function metaErr(d) {
  const e = (d && d.error) || {};
  return (e.error_data && e.error_data.details) || e.message || 'خطأ من ميتا';
}

async function validSig(raw, header, secret) {
  if (!header || !header.startsWith('sha256=')) return false;
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(raw)));
  const hex = Array.from(mac, b => b.toString(16).padStart(2, '0')).join('');
  return hex === header.slice(7);
}

function audience(d) {
  const act = lastActivity(), t = today();
  const P = D.pets;
  return D.customers.filter(c => {
    if (!c.promo) return false;
    const pets = P.filter(p => p.custId === c.id);
    if (d.species && !pets.some(p => p.species === d.species)) return false;
    if (d.aud === 'inactive') { const a = act.get(c.id); if (a && dnum(t) - dnum(a) < (+d.days || 90)) return false; }
    if (d.aud === 'expired') { const ss = D.subs.filter(s => s.custId === c.id && s.status !== 'cancelled'); if (!ss.length || ss.some(s => daysTo(s.end) >= 0)) return false; }
    if (d.aud === 'noshow') { if (!(D.appts || []).some(a => a.custId === c.id && a.status === 'لم يحضر' && daysTo(a.day) >= -60)) return false; }
    if (d.aud === 'nopkg') { if (D.subs.some(s => s.custId === c.id && s.status !== 'cancelled' && daysTo(s.end) >= 0)) return false; }
    return true;
  });
}

function exportCustomers() {
  const head = ['اسم المالك', 'الجوال', 'موافقة التذكيرات', 'موافقة الدعاية', 'اسم الحيوان', 'النوع', 'السلالة', 'الجنس', 'تاريخ الميلاد', 'الوزن', 'آخر تطعيم', 'تاريخ آخر تطعيم', 'الموعد القادم'];
  const cell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [head]; const lv = latestVacs();
  const ph = c => '="' + localPhone(c.phone) + '"';   // يحفظ الصفر الأول عند الفتح في Excel
  D.customers.forEach(c => {
    const pets = D.pets.filter(p => p.custId === c.id);
    if (!pets.length) rows.push([c.name, ph(c), c.remind ? 'نعم' : 'لا', c.promo ? 'نعم' : 'لا']);
    pets.forEach(p => {
      const vs = lv.filter(v => v.petId === p.id);
      const base = [c.name, ph(c), c.remind ? 'نعم' : 'لا', c.promo ? 'نعم' : 'لا', p.name, p.species, p.breed, p.sex, p.birth, p.weight];
      if (!vs.length) rows.push(base);
      vs.forEach(v => rows.push(base.concat([v.vaccine, v.given, vacDue(v)])));
    });
  });
  download('عملاء-الأنامل-' + today() + '.csv', '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

      const name = v('name'), text = f.text.value.trim(); if (!name || !text) throw 'اكتب الاسم والنص';
      let p = D.promos.find(x => x.id === f.dataset.id);
      if (!p) { p = { id: uid('M') }; D.promos.push(p); }
      Object.assign(p, { name, text }); save(); closeModal(); toast('تم حفظ القالب'); render();
    } else if (kind === 'settings') {
      const ph = v('phone'); if (ph && !normPhone(ph)) throw 'رقم العيادة غير صحيح';
      Object.assign(D.settings, { clinicEn: v('clinicEn'), phones: v('phones'), vet: v('vet'), bookColor: v('bookColor') || '#E4692A', address: v('address'), addressEn: v('addressEn'), clinic: v('clinic') || D.settings.clinic, phone: ph ? localPhone(normPhone(ph)) : '', limit: Math.max(1, +v('limit') || 500), avg: Math.max(0, +digits(v('avg')) || 0), before: Math.min(30, Math.max(1, +v('before') || 7)), after: Math.min(30, Math.max(1, +v('after') || 3)) });
      save(); toast('تم الحفظ'); render();
    }
  } catch (err) { toast(typeof err === 'string' ? err : 'صار خطأ، حاول مرة ثانية', 1); if (typeof err !== 'string') console.error(err); }
});
let lastTA = null;
document.addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA') lastTA = e.target; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

render();
</script>
</body>
</html>
